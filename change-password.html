<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Changer le mot de passe | BISHROU BARBER</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#080a0c;--panel:#101316;--gold:#d5a94f;--line:#262b31;--muted:#9299a1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}h1{margin:0 0 8px;font:500 30px Georgia,serif}.muted{color:var(--muted);font-size:13px;line-height:1.5}.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:12px;color:#b9bec4}.field input{width:100%;border:1px solid #333942;background:#0b0e11;color:#fff;border-radius:9px;padding:12px;min-height:46px;font:inherit}.btn{width:100%;margin-top:14px;border:1px solid var(--gold);background:var(--gold);color:#12100b;border-radius:9px;padding:12px;cursor:pointer;font-weight:800}.back{display:block;text-align:center;margin-top:12px;color:#e6c36c;text-decoration:none}.ok{color:#7ee39f}.bad{color:#ff9797}</style></head><body><main class="card"><h1>Changer le mot de passe</h1><p class="muted">Cette page fonctionne uniquement si la session Admin est déjà ouverte sur cet appareil.</p><div id="form" hidden><div class="field"><label>Nouveau mot de passe</label><input id="p1" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmer le mot de passe</label><input id="p2" type="password" autocomplete="new-password"></div><button id="save" class="btn" type="button">Changer le mot de passe</button></div><p id="msg" class="muted">Vérification de la session…</p><a class="back" href="admin.html">← Retour à l’Admin</a></main><script>const U='https://zcbwvzqmdajaxybxcpqq.supabase.co',K='sb_publishable_PY94SVGfTQxHaF_qPfETLA_WBZKvnxe',A='bishroubarber@gmail.com';const sb=supabase.createClient(U,K);const $=id=>document.getElementById(id);(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session||session.user?.email?.toLowerCase()!==A){$('msg').className='bad';$('msg').textContent='Session Admin غير مفتوحة هنا. رجع لصفحة Admin وسجّل الدخول.';return}$('form').hidden=false;$('msg').textContent='Session Admin active.';$('msg').className='ok'})();$('save').onclick=async()=>{const a=$('p1').value,b=$('p2').value;if(a.length<8){$('msg').className='bad';$('msg').textContent='Mot de passe خاصو يكون 8 حروف على الأقل.';return}if(a!==b){$('msg').className='bad';$('msg').textContent='Les mots de passe ne correspondent pas.';return}$('save').disabled=true;$('msg').textContent='Modification…';const{error}=await sb.auth.updateUser({password:a});$('save').disabled=false;if(error){$('msg').className='bad';$('msg').textContent=error.message;return}$('msg').className='ok';$('msg').textContent='✓ Mot de passe changé. دابا تقدر تدخل به من أي جهاز.';$('p1').value=$('p2').value=''}</script></body></html>
