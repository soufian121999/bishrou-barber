<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | BISHROU BARBER</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#090909;--card:#121212;--gold:#c89a52;--line:#2b2b2b;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#090909ee;border-bottom:1px solid var(--line)}.nav{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.btn{border:1px solid #3a3a3a;background:#151515;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer;text-decoration:none}.gold{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800}.danger{border-color:#633;color:#ffb2b2}.login{min-height:calc(100vh - 66px);display:grid;place-items:center}.box,.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:16px}.box{width:min(460px,calc(100% - 24px));padding:26px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #333;background:#0b0b0b;color:#fff;border-radius:9px}.wide{width:100%;margin-top:10px}.dashboard{display:none;padding:22px 0 80px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel{padding:16px;margin-bottom:12px}.stat b{display:block;font-size:27px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab.active{background:var(--gold);color:#111}.pane{display:none}.pane.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.booking{border:1px solid #2a2a2a;border-left:5px solid #555;border-radius:12px;padding:14px;margin:10px 0;background:#0e0e0e}.booking.pending{border-left-color:#f3c74f}.booking.confirmed{border-left-color:#3ecf73}.booking.completed{border-left-color:#4f9cff}.booking.cancelled{border-left-color:#ff5b5b}.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;margin-top:7px}.badge.pending{background:#f3c74f22;color:#ffd95c;border:1px solid #f3c74f66}.badge.confirmed{background:#3ecf7322;color:#62e895;border:1px solid #3ecf7366}.badge.completed{background:#4f9cff22;color:#78b4ff;border:1px solid #4f9cff66}.badge.cancelled{background:#ff5b5b22;color:#ff8585;border:1px solid #ff5b5b66}.hide{display:none}.item{border-top:1px solid #272727;padding:14px 0}.thumb{width:80px;height:80px;object-fit:cover;border-radius:10px}.imgrow{display:grid;grid-template-columns:90px 1fr;gap:12px}.check{display:flex;gap:8px;align-items:center}.ok{color:#9bd3a8}.bad{color:#ffaaaa}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.imgrow{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap nav"><b class="brand">BISHROU <span>ADMIN</span></b><div><a class="btn" href="index.html">← Site</a> <button id="logout" class="btn hide">Déconnexion</button></div></div></header><section id="login" class="login"><form id="loginForm" class="box"><h1>Profil Admin</h1><div class="field"><label>Email</label><input id="email" value="bishroubarber@gmail.com"></div><div class="field"><label>Mot de passe</label><input id="password" type="password"></div><button class="btn gold wide">Se connecter</button><button id="forgot" class="btn wide" type="button">Mot de passe oublié</button><p id="loginMsg" class="muted"></p></form></section><section id="dashboard" class="dashboard"><div class="wrap"><h1>Tableau de bord</h1><div class="stats"><div class="stat">Réservations<b id="sTotal">0</b></div><div class="stat">En attente<b id="sPending">0</b></div><div class="stat">Confirmées<b id="sConfirmed">0</b></div><div class="stat">Barbers actifs<b id="sBarbers">0</b></div></div><div class="tabs"><button class="btn tab active" data-tab="reservations">Réservations</button><button class="btn tab" data-tab="services">Services</button><button class="btn tab" data-tab="barbers">Barbers</button><button class="btn tab" data-tab="site">Site & horaires</button><button class="btn tab" data-tab="blocks">Créneaux bloqués</button></div><section id="reservations" class="panel pane active"><h2>Réservations</h2><div id="bookings"></div></section><section id="services" class="panel pane"><h2>Services</h2><div id="servicesList"></div><button id="saveServices" class="btn gold">Enregistrer les services</button></section><section id="barbers" class="panel pane"><h2>Barbers</h2><div id="barbersList"></div><button id="saveBarbers" class="btn gold">Enregistrer les barbers</button></section><section id="site" class="panel pane"><h2>Site & horaires</h2><div class="grid"><div class="field"><label>Marque</label><input id="brand"></div><div class="field"><label>Téléphone</label><input id="phone"></div><div class="field"><label>Email</label><input id="contactEmail"></div><div class="field"><label>Instagram</label><input id="instagram"></div><div class="field"><label>Titre FR</label><input id="heroFr"></div><div class="field"><label>Titre AR</label><input id="heroAr"></div><div class="field"><label>Ouverture</label><input id="opening" type="time"></div><div class="field"><label>Fermeture</label><input id="closing" type="time"></div><div class="field"><label>Durée</label><select id="slot"><option>15</option><option>30</option><option>45</option><option>60</option></select></div></div><button id="saveSite" class="btn gold">Enregistrer le site</button></section><section id="blocks" class="panel pane"><h2>Créneaux bloqués</h2><div class="grid"><div class="field"><label>Barber</label><select id="blockBarber"></select></div><div class="field"><label>Date</label><input id="blockDate" type="date"></div><div class="field"><label>Heure</label><input id="blockTime" type="time"></div><div class="field"><label>Raison</label><input id="blockReason"></div></div><button id="addBlock" class="btn gold">Bloquer</button><div id="blocksList"></div></section><p id="globalMsg" class="muted"></p></div></section><script>const U='https://zcbwvzqmdajaxybxcpqq.supabase.co',K='sb_publishable_PY94SVGfTQxHaF_qPfETLA_WBZKvnxe',A='bishroubarber@gmail.com',sb=supabase.createClient(U,K),$=x=>document.getElementById(x);let services=[],barbers=[],reservations=[],blocks=[],settings={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function gmsg(t,ok=true){$('globalMsg').className=ok?'ok':'bad';$('globalMsg').textContent=t;setTimeout(()=>$('globalMsg').textContent='',3000)}async function loadAll(){const[st,sv,bv,rv,bl]=await Promise.all([sb.from('site_settings').select('*').eq('key','general').maybeSingle(),sb.from('services').select('*').order('sort_order'),sb.from('barbers').select('*').order('sort_order'),sb.from('reservations').select('*,services(name_fr),barbers(name)').order('created_at',{ascending:false}),sb.from('blocked_slots').select('*,barbers(name)').order('blocked_date',{ascending:false})]);settings=st.data?.value||{};services=sv.data||[];barbers=bv.data||[];reservations=rv.data||[];blocks=bl.data||[];render()}function render(){sTotal.textContent=reservations.length;sPending.textContent=reservations.filter(x=>x.status==='Pending').length;sConfirmed.textContent=reservations.filter(x=>x.status==='Confirmed').length;sBarbers.textContent=barbers.filter(x=>x.active).length;renderReservations();renderServices();renderBarbers();renderSite();renderBlocks()}function cls(s){return String(s||'').toLowerCase()}function renderReservations(){bookings.innerHTML=reservations.map(x=>`<div class="booking ${cls(x.status)}"><b>${esc(x.customer_name)} — ${esc(x.phone)}</b><div class="muted">${esc(x.reservation_date)} · ${esc(String(x.reservation_time).slice(0,5))} · ${esc(x.barbers?.name||'')} · ${esc(x.services?.name_fr||'')}</div><span class="badge ${cls(x.status)}">${esc(x.status)}</span><div class="actions"><button class="btn" onclick="setStatus(${x.id},'Confirmed')">Confirmer</button><button class="btn" onclick="setStatus(${x.id},'Completed')">Terminé</button><button class="btn" onclick="setStatus(${x.id},'Cancelled')">Annuler</button><button class="btn danger" onclick="delRes(${x.id})">Supprimer</button></div></div>`).join('')||'<p class="muted">Aucune réservation.</p>'}window.setStatus=async(id,status)=>{const{error}=await sb.from('reservations').update({status}).eq('id',id);if(error)return gmsg(error.message,false);loadAll()};window.delRes=async id=>{if(!confirm('Supprimer cette réservation ?'))return;const{error}=await sb.from('reservations').delete().eq('id',id);if(error)return gmsg(error.message,false);loadAll()};function renderServices(){servicesList.innerHTML=services.map(x=>`<div class="item serviceRow" data-id="${x.id}"><div class="grid"><div class="field"><label>Nom FR</label><input data-k="name_fr" value="${esc(x.name_fr)}"></div><div class="field"><label>Nom AR</label><input data-k="name_ar" value="${esc(x.name_ar)}"></div><div class="field"><label>Image URL</label><input data-k="image_url" value="${esc(x.image_url)}"></div><div class="field"><label>Ordre</label><input data-k="sort_order" type="number" value="${x.sort_order||0}"></div></div><label class="check"><input data-k="active" type="checkbox" ${x.active?'checked':''}> Actif</label></div>`).join('')}saveServices.onclick=async()=>{for(const r of document.querySelectorAll('.serviceRow')){let p={};r.querySelectorAll('[data-k]').forEach(e=>p[e.dataset.k]=e.type==='checkbox'?e.checked:e.type==='number'?Number(e.value):e.value);const{error}=await sb.from('services').update(p).eq('id',r.dataset.id);if(error)return gmsg(error.message,false)}gmsg('Services enregistrés');loadAll()};function renderBarbers(){barbersList.innerHTML=barbers.map(x=>`<div class="item barberRow" data-id="${x.id}"><div class="grid"><div class="field"><label>Nom</label><input data-k="name" value="${esc(x.name)}"></div><div class="field"><label>Image URL</label><input data-k="image_url" value="${esc(x.image_url)}"></div></div><label class="check"><input data-k="active" type="checkbox" ${x.active?'checked':''}> Actif</label></div>`).join('');blockBarber.innerHTML='<option value="">Tous</option>'+barbers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}saveBarbers.onclick=async()=>{for(const r of document.querySelectorAll('.barberRow')){let p={};r.querySelectorAll('[data-k]').forEach(e=>p[e.dataset.k]=e.type==='checkbox'?e.checked:e.value);const{error}=await sb.from('barbers').update(p).eq('id',r.dataset.id);if(error)return gmsg(error.message,false)}gmsg('Barbers enregistrés');loadAll()};function renderSite(){brand.value=settings.brand||'BISHROU BARBER';phone.value=settings.phone||'';contactEmail.value=settings.email||'';instagram.value=settings.instagram||'';heroFr.value=settings.hero_fr||'';heroAr.value=settings.hero_ar||'';opening.value=settings.opening||'09:00';closing.value=settings.closing||'22:00';slot.value=String(settings.slot_minutes||30)}saveSite.onclick=async()=>{const value={...settings,brand:brand.value,phone:phone.value,email:contactEmail.value,instagram:instagram.value,hero_fr:heroFr.value,hero_ar:heroAr.value,opening:opening.value,closing:closing.value,slot_minutes:Number(slot.value)};const{error}=await sb.from('site_settings').update({value}).eq('key','general');if(error)return gmsg(error.message,false);settings=value;gmsg('Site enregistré')};function renderBlocks(){blocksList.innerHTML=blocks.map(x=>`<div class="item"><b>${esc(x.blocked_date)} ${x.blocked_time?esc(String(x.blocked_time).slice(0,5)):'Toute la journée'}</b><div class="muted">${esc(x.barbers?.name||'Tous')} ${esc(x.reason||'')}</div></div>`).join('')}addBlock.onclick=async()=>{const{error}=await sb.from('blocked_slots').insert({barber_id:blockBarber.value?Number(blockBarber.value):null,blocked_date:blockDate.value,blocked_time:blockTime.value||null,reason:blockReason.value});if(error)return gmsg(error.message,false);loadAll()};loginForm.onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});if(error){loginMsg.textContent='Mot de passe incorrect';return}enter()};forgot.onclick=async()=>{const{error}=await sb.auth.resetPasswordForEmail(A,{redirectTo:'https://bishrou-barber.vercel.app/admin.html'});loginMsg.textContent=error?error.message:'Lien envoyé à Gmail'};logout.onclick=async()=>{await sb.auth.signOut();location.reload()};function enter(){login.style.display='none';dashboard.style.display='block';logout.classList.remove('hide');loadAll()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});(async()=>{const{data:{session}}=await sb.auth.getSession();if(session?.user?.email?.toLowerCase()===A)enter()})();</script></body></html>
