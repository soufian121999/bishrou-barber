<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin | BISHROU BARBER</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#090909;--card:#121212;--gold:#c89a52;--line:#292929;--muted:#8d8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.wrap{width:min(1160px,calc(100% - 24px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#090909e8;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.nav{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.btn{border:1px solid #3a3a3a;background:#151515;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer;text-decoration:none;font-size:12px}.btn.gold{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800}.login{min-height:calc(100vh - 66px);display:grid;place-items:center}.loginbox{width:min(460px,100%);background:#111;border:1px solid var(--line);border-radius:18px;padding:24px}.loginbox h1,.hero h1,.panel h2{font-family:Georgia,serif;font-weight:500}.loginbox h1{font-size:36px;margin:0 0 8px}.loginbox p,.muted{color:var(--muted);font-size:13px;line-height:1.55}.field{display:grid;gap:7px;margin-top:12px}.field label{font-size:12px;color:#aaa}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #333;background:#0d0d0d;color:#fff;border-radius:9px;font:inherit}.dashboard{display:none;padding:28px 0 80px}.hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:20px}.hero h1{font-size:42px;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat small{color:#777}.stat b{display:block;font-size:27px;margin-top:5px}.panel{padding:17px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-top:1px solid #242424;padding:13px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.save{width:100%;margin-top:12px}.booking{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #252525;padding:13px 0}.booking small{display:block;color:#777;margin-top:4px}.status{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:999px;background:#232323;font-size:10px}.danger{color:#ff9f9f}.ok{color:#95d7a5}.hide{display:none}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab.active{background:var(--gold);color:#111;border-color:var(--gold)}.sectionpane{display:none}.sectionpane.active{display:block}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.booking{flex-direction:column}}</style></head><body><header class="top"><div class="wrap nav"><div class="brand">BISHROU <span>ADMIN</span></div><div><a class="btn" href="index.html">← Site</a> <button id="logout" class="btn hide">Déconnexion</button></div></div></header><main><section id="login" class="login"><form id="loginForm" class="loginbox"><h1>Profil Admin</h1><p>Seul <b>bishroubarber@gmail.com</b> peut modifier les données.</p><div class="field"><label>Email</label><input id="email" type="email" value="bishroubarber@gmail.com" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" minlength="6" required></div><button class="btn gold save" type="submit">Se connecter</button><button id="createAccount" class="btn save" type="button">Créer le compte Admin (1ère fois)</button><p id="loginMsg" class="muted"></p></form></section><section id="dashboard" class="dashboard"><div class="wrap"><div class="hero"><h1>Tableau de bord</h1><button id="refresh" class="btn">Actualiser</button></div><div class="stats"><div class="stat"><small>Réservations</small><b id="sTotal">0</b></div><div class="stat"><small>En attente</small><b id="sPending">0</b></div><div class="stat"><small>Confirmées</small><b id="sConfirmed">0</b></div><div class="stat"><small>Barbers actifs</small><b id="sBarbers">0</b></div></div><div class="tabs"><button class="btn tab active" data-tab="reservations">Réservations</button><button class="btn tab" data-tab="services">Services</button><button class="btn tab" data-tab="barbers">Barbers</button><button class="btn tab" data-tab="site">Site & horaires</button><button class="btn tab" data-tab="blocks">Créneaux bloqués</button></div><section id="reservations" class="panel sectionpane active"><h2>Réservations</h2><div id="bookings"></div></section><section id="services" class="panel sectionpane"><h2>Services</h2><div id="servicesList"></div><button id="addService" class="btn">+ Ajouter service</button><button id="saveServices" class="btn gold save">Enregistrer</button></section><section id="barbers" class="panel sectionpane"><h2>Barbers</h2><div id="barbersList"></div><button id="addBarber" class="btn">+ Ajouter barber</button><button id="saveBarbers" class="btn gold save">Enregistrer</button></section><section id="site" class="panel sectionpane"><h2>Site & horaires</h2><div class="row"><div class="field"><label>Nom / marque</label><input id="brand"></div><div class="field"><label>Téléphone</label><input id="phone"></div><div class="field"><label>Email</label><input id="contactEmail"></div><div class="field"><label>Instagram</label><input id="instagram"></div><div class="field"><label>Hero FR</label><input id="heroFr"></div><div class="field"><label>Hero AR</label><input id="heroAr"></div><div class="field"><label>Ouverture</label><input id="opening" type="time"></div><div class="field"><label>Fermeture</label><input id="closing" type="time"></div><div class="field"><label>Durée créneau</label><select id="slot"><option>15</option><option>30</option><option>45</option><option>60</option></select></div><div class="field"><label>Jours fermés</label><select id="closed" multiple size="7"><option value="1">Lundi</option><option value="2">Mardi</option><option value="3">Mercredi</option><option value="4">Jeudi</option><option value="5">Vendredi</option><option value="6">Samedi</option><option value="0">Dimanche</option></select></div></div><button id="saveSite" class="btn gold save">Enregistrer le site</button></section><section id="blocks" class="panel sectionpane"><h2>Bloquer un créneau</h2><div class="row"><div class="field"><label>Barber</label><select id="blockBarber"></select></div><div class="field"><label>Date</label><input id="blockDate" type="date"></div><div class="field"><label>Heure</label><input id="blockTime" type="time"></div><div class="field"><label>Raison</label><input id="blockReason"></div></div><button id="addBlock" class="btn gold save">Bloquer</button><div id="blocksList"></div></section><p id="globalMsg" class="muted"></p></div></section></main><script>const SUPABASE_URL='https://zcbwvzqmdajaxybxcpqq.supabase.co',SUPABASE_KEY='sb_publishable_PY94SVGfTQxHaF_qPfETLA_WBZKvnxe',ADMIN_EMAIL='bishroubarber@gmail.com';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);let services=[],barbers=[],reservations=[],blocks=[],settings={};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function msg(t,ok=false){$('loginMsg').className=ok?'muted ok':'muted danger';$('loginMsg').textContent=t}async function verify(){const {data:{session}}=await sb.auth.getSession();if(session?.user?.email?.toLowerCase()===ADMIN_EMAIL)enter()}async function enter(){$('login').style.display='none';$('dashboard').style.display='block';$('logout').classList.remove('hide');await loadAll()}$('loginForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase();if(email!==ADMIN_EMAIL)return msg('Email non autorisé.');const {error}=await sb.auth.signInWithPassword({email,password:$('password').value});if(error)return msg(error.message);enter()};$('createAccount').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(email!==ADMIN_EMAIL)return msg('Utilisez bishroubarber@gmail.com');const {data,error}=await sb.auth.signUp({email,password});if(error)return msg(error.message);msg(data.session?'Compte créé et connecté.':'Compte créé. Vérifiez l’email puis connectez-vous.',true);if(data.session)enter()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=loadAll;async function loadAll(){const [st,sv,bv,rv,bl]=await Promise.all([sb.from('site_settings').select('*').eq('key','general').maybeSingle(),sb.from('services').select('*').order('sort_order'),sb.from('barbers').select('*').order('sort_order'),sb.from('reservations').select('*,services(name_fr),barbers(name)').order('created_at',{ascending:false}),sb.from('blocked_slots').select('*,barbers(name)').order('blocked_date',{ascending:false})]);if(st.error||sv.error||bv.error||rv.error||bl.error)return $('globalMsg').textContent='Erreur de chargement.';settings=st.data?.value||{};services=sv.data||[];barbers=bv.data||[];reservations=rv.data||[];blocks=bl.data||[];render()}function render(){$('sTotal').textContent=reservations.length;$('sPending').textContent=reservations.filter(x=>x.status==='Pending').length;$('sConfirmed').textContent=reservations.filter(x=>x.status==='Confirmed').length;$('sBarbers').textContent=barbers.filter(x=>x.active).length;$('bookings').innerHTML=reservations.map(x=>`<div class="booking"><div><b>${esc(x.customer_name)} — ${esc(x.phone)}</b><small>${esc(x.reservation_date)} · ${esc(String(x.reservation_time).slice(0,5))} · ${esc(x.barbers?.name||'')} · ${esc(x.services?.name_fr||'')}</small><span class="status">${esc(x.status)}</span></div><div class="actions"><button class="btn" onclick="setStatus(${x.id},'Confirmed')">Confirmer</button><button class="btn" onclick="setStatus(${x.id},'Completed')">Terminé</button><button class="btn" onclick="setStatus(${x.id},'Cancelled')">Annuler</button></div></div>`).join('')||'<p class="muted">Aucune réservation.</p>';renderServices();renderBarbers();renderSite();renderBlocks()}window.setStatus=async(id,status)=>{await sb.from('reservations').update({status,updated_at:new Date().toISOString()}).eq('id',id);loadAll()};function renderServices(){$('servicesList').innerHTML=services.map((x,i)=>`<div class="item" data-service data-id="${x.id||''}"><div class="field"><label>Nom FR</label><input data-k="name_fr" value="${esc(x.name_fr||'')}"></div><div class="field"><label>Nom AR</label><input data-k="name_ar" value="${esc(x.name_ar||'')}"></div><div class="field"><label>URL image</label><input data-k="image_url" value="${esc(x.image_url||'')}"></div><label><input data-k="active" type="checkbox" ${x.active!==false?'checked':''}> Actif</label></div>`).join('')}$('addService').onclick=()=>{services.push({name_fr:'Nouveau service',name_ar:'خدمة جديدة',active:true});renderServices()};$('saveServices').onclick=async()=>{for(const row of document.querySelectorAll('[data-service]')){let p={};row.querySelectorAll('[data-k]').forEach(el=>p[el.dataset.k]=el.type==='checkbox'?el.checked:el.value.trim());row.dataset.id?await sb.from('services').update(p).eq('id',row.dataset.id):await sb.from('services').insert(p)}loadAll()};function renderBarbers(){$('barbersList').innerHTML=barbers.map(x=>`<div class="item" data-barber data-id="${x.id||''}"><div class="field"><label>Nom</label><input data-k="name" value="${esc(x.name||'')}"></div><div class="field"><label>URL image</label><input data-k="image_url" value="${esc(x.image_url||'')}"></div><label><input data-k="active" type="checkbox" ${x.active!==false?'checked':''}> Actif</label></div>`).join('');$('blockBarber').innerHTML='<option value="">Tous</option>'+barbers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}$('addBarber').onclick=()=>{barbers.push({name:'Nouveau barber',active:true});renderBarbers()};$('saveBarbers').onclick=async()=>{for(const row of document.querySelectorAll('[data-barber]')){let p={};row.querySelectorAll('[data-k]').forEach(el=>p[el.dataset.k]=el.type==='checkbox'?el.checked:el.value.trim());row.dataset.id?await sb.from('barbers').update(p).eq('id',row.dataset.id):await sb.from('barbers').insert(p)}loadAll()};function renderSite(){$('brand').value=settings.brand||'BISHROU BARBER';$('phone').value=settings.phone||'';$('contactEmail').value=settings.email||'';$('instagram').value=settings.instagram||'';$('heroFr').value=settings.hero_fr||'';$('heroAr').value=settings.hero_ar||'';$('opening').value=settings.opening||'09:00';$('closing').value=settings.closing||'22:00';$('slot').value=String(settings.slot_minutes||30);[...$('closed').options].forEach(o=>o.selected=(settings.closed_days||[]).map(Number).includes(Number(o.value)))}$('saveSite').onclick=async()=>{const value={...settings,brand:$('brand').value.trim(),phone:$('phone').value.trim(),email:$('contactEmail').value.trim(),instagram:$('instagram').value.trim(),hero_fr:$('heroFr').value.trim(),hero_ar:$('heroAr').value.trim(),opening:$('opening').value,closing:$('closing').value,slot_minutes:Number($('slot').value),closed_days:[...$('closed').selectedOptions].map(o=>Number(o.value))};await sb.from('site_settings').update({value,updated_at:new Date().toISOString()}).eq('key','general');loadAll()};function renderBlocks(){$('blocksList').innerHTML=blocks.map(x=>`<div class="item"><b>${esc(x.blocked_date)} ${x.blocked_time?esc(String(x.blocked_time).slice(0,5)):'— journée'}</b><div class="muted">${esc(x.barbers?.name||'Tous')}</div></div>`).join('')}$('addBlock').onclick=async()=>{if(!$('blockDate').value)return alert('Choisissez une date');await sb.from('blocked_slots').insert({barber_id:$('blockBarber').value?Number($('blockBarber').value):null,blocked_date:$('blockDate').value,blocked_time:$('blockTime').value||null,reason:$('blockReason').value.trim()});loadAll()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.sectionpane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});verify();</script></body></html>
