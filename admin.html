<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin | BISHROU BARBER</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#090909;--card:#121212;--gold:#c89a52;--line:#292929;--muted:#8d8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.wrap{width:min(1160px,calc(100% - 24px));margin:auto}.top{background:#090909;border-bottom:1px solid var(--line)}.nav{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.btn{border:1px solid #3a3a3a;background:#151515;color:#fff;border-radius:9px;padding:11px 13px;cursor:pointer;text-decoration:none}.gold{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800}.login{min-height:calc(100vh - 66px);display:grid;place-items:center}.box,.panel,.stat{background:#121212;border:1px solid var(--line);border-radius:16px}.box{width:min(460px,calc(100% - 24px));padding:26px}.box h1,h2{font-family:Georgia,serif;font-weight:500}.box h1{font-size:38px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.field{display:grid;gap:7px;margin:13px 0}.field input,.field select{padding:13px;border:1px solid #333;background:#0b0b0b;color:#fff;border-radius:9px;font:inherit}.wide{width:100%;margin-top:10px}.ok{color:#9bd3a8}.bad{color:#ffaaaa}.dashboard{display:none;padding:25px 0 80px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel{padding:16px;margin-bottom:12px}.stat b{display:block;font-size:27px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab.active{background:var(--gold);color:#111}.pane{display:none}.pane.active{display:block}.booking,.item{border-top:1px solid #272727;padding:13px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap nav"><b class="brand">BISHROU <span>ADMIN</span></b><div><a class="btn" href="index.html">← Site</a> <button id="logout" class="btn hide">Déconnexion</button></div></div></header><section id="login" class="login"><form id="loginForm" class="box"><h1>Profil Admin</h1><p class="muted">Seul <b>bishroubarber@gmail.com</b> peut modifier les données.</p><div class="field"><label>Email</label><input id="email" type="email" value="bishroubarber@gmail.com" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" minlength="6" required></div><button class="btn gold wide" type="submit">Se connecter</button><button id="createAccount" class="btn wide" type="button">Créer le compte Admin (1ère fois)</button><button id="resendConfirmation" class="btn wide" type="button">📩 Renvoyer l’email de confirmation</button><p id="loginMsg" class="muted"></p></form></section><section id="dashboard" class="dashboard"><div class="wrap"><h1>Tableau de bord</h1><div class="stats"><div class="stat">Réservations<b id="sTotal">0</b></div><div class="stat">En attente<b id="sPending">0</b></div><div class="stat">Confirmées<b id="sConfirmed">0</b></div><div class="stat">Barbers actifs<b id="sBarbers">0</b></div></div><div class="tabs"><button class="btn tab active" data-tab="reservations">Réservations</button><button class="btn tab" data-tab="services">Services</button><button class="btn tab" data-tab="barbers">Barbers</button><button class="btn tab" data-tab="site">Site</button><button class="btn tab" data-tab="blocks">Créneaux</button></div><div id="reservations" class="panel pane active"><h2>Réservations</h2><div id="bookings"></div></div><div id="services" class="panel pane"><h2>Services</h2><div id="servicesList"></div></div><div id="barbers" class="panel pane"><h2>Barbers</h2><div id="barbersList"></div></div><div id="site" class="panel pane"><h2>Site & horaires</h2><p class="muted">Gestion connectée à Supabase.</p></div><div id="blocks" class="panel pane"><h2>Créneaux bloqués</h2><div id="blocksList"></div></div></div></section><script>const U='https://zcbwvzqmdajaxybxcpqq.supabase.co',K='sb_publishable_PY94SVGfTQxHaF_qPfETLA_WBZKvnxe',A='bishroubarber@gmail.com',sb=supabase.createClient(U,K),$=x=>document.getElementById(x);function msg(t,ok=false){$('loginMsg').className='muted '+(ok?'ok':'bad');$('loginMsg').textContent=t}async function enter(){const[r,b,s,bl]=await Promise.all([sb.from('reservations').select('*,services(name_fr),barbers(name)').order('created_at',{ascending:false}),sb.from('barbers').select('*').order('sort_order'),sb.from('services').select('*').order('sort_order'),sb.from('blocked_slots').select('*,barbers(name)').order('blocked_date',{ascending:false})]);$('login').style.display='none';$('dashboard').style.display='block';$('logout').classList.remove('hide');let rv=r.data||[],ba=b.data||[],sv=s.data||[],blocks=bl.data||[];$('sTotal').textContent=rv.length;$('sPending').textContent=rv.filter(x=>x.status==='Pending').length;$('sConfirmed').textContent=rv.filter(x=>x.status==='Confirmed').length;$('sBarbers').textContent=ba.filter(x=>x.active).length;$('bookings').innerHTML=rv.map(x=>`<div class="booking"><b>${x.customer_name} — ${x.phone}</b><div class="muted">${x.reservation_date} ${String(x.reservation_time).slice(0,5)} · ${x.barbers?.name||''} · ${x.services?.name_fr||''} · ${x.status}</div><div class="actions"><button class="btn" onclick="statusSet(${x.id},'Confirmed')">Confirmer</button><button class="btn" onclick="statusSet(${x.id},'Completed')">Terminé</button><button class="btn" onclick="statusSet(${x.id},'Cancelled')">Annuler</button></div></div>`).join('')||'<p class="muted">Aucune réservation.</p>';$('servicesList').innerHTML=sv.map(x=>`<div class="item"><b>${x.name_fr}</b><div class="muted">${x.name_ar}</div></div>`).join('');$('barbersList').innerHTML=ba.map(x=>`<div class="item"><b>${x.name}</b><div class="muted">${x.active?'Actif':'Inactif'}</div></div>`).join('');$('blocksList').innerHTML=blocks.map(x=>`<div class="item">${x.blocked_date} ${x.blocked_time||''} — ${x.barbers?.name||'Tous'}</div>`).join('')}window.statusSet=async(id,status)=>{await sb.from('reservations').update({status}).eq('id',id);enter()};$('loginForm').onsubmit=async e=>{e.preventDefault();let email=$('email').value.trim().toLowerCase();if(email!==A)return msg('Email non autorisé.');const{error}=await sb.auth.signInWithPassword({email,password:$('password').value});if(error)return msg(error.message);enter()};$('createAccount').onclick=async()=>{let email=$('email').value.trim().toLowerCase(),password=$('password').value;if(email!==A)return msg('Utilisez '+A);const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://bishrou-barber.vercel.app/admin.html'}});if(error)return msg(error.message);msg(data.session?'Compte créé et connecté.':'Compte créé. Vérifiez votre email.',true)};$('resendConfirmation').onclick=async()=>{let email=$('email').value.trim().toLowerCase();if(email!==A)return msg('Utilisez '+A);$('resendConfirmation').disabled=true;msg('Envoi en cours…',true);const{error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:'https://bishrou-barber.vercel.app/admin.html'}});$('resendConfirmation').disabled=false;if(error)return msg('Erreur: '+error.message);msg('✓ Email de confirmation renvoyé. Vérifiez Gmail et Spam.',true)};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});(async()=>{const{data:{session}}=await sb.auth.getSession();if(session?.user?.email?.toLowerCase()===A)enter()})();</script></body></html>
